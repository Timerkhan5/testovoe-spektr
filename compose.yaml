services:
  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    command: ["sh", "-c", "php scripts/migrate.php && exec php -S 0.0.0.0:8080 -t public public/index.php"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-spektr}
      MYSQL_USER: ${DB_USER:-spektr}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
